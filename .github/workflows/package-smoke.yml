name: Package integration
on:
  pull_request:
    paths:
      - herdr-plugin.toml
      - scripts/**
      - .github/workflows/package-smoke.yml
      - .github/workflows/release.yml
      - release-pin
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: linux-x86_64, triple: x86_64-unknown-linux-musl}
          - {os: macos-15, target: macos-aarch64, triple: aarch64-apple-darwin}
          - {os: macos-15-intel, target: macos-x86_64, triple: x86_64-apple-darwin}
          - {os: windows-2022, target: windows-x86_64, triple: x86_64-pc-windows-msvc}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build release executable
        shell: bash
        env:
          TRIPLE: ${{ matrix.triple }}
        run: |
          rustup target add "$TRIPLE"
          cargo build --locked --release --target "$TRIPLE"
      - name: Verify packaged executable, install hooks, and Herdr integration
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(python -c 'import tomllib; print("v"+tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          python scripts/release.py package "$tag" "$TARGET"
          python scripts/smoke.py "$tag" "$TARGET"
