[package]
name = "herdr-wt"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Initialize Git worktrees from their source checkout"
repository = "https://github.com/spucman/herdr-wt"
readme = "README.md"

[dependencies]
anyhow = "1"
cap-std = "4.0"
cap-fs-ext = "3.4"
dirs-sys = "0.5"
dunce = "1"
fastrand = "2"
fs4 = { version = "1.1", default-features = false, features = ["sync"] }
glob = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = { version = "0.8", default-features = false, features = ["parse"] }
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1"
winx = "0.36"
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }
