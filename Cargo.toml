[package]
name = "herdr-wt"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Initialize Git worktrees from their source checkout"
repository = "https://github.com/spucman/herdr-wt"
readme = "README.md"

[dependencies]
anyhow = "1"
cap-std = "3.4"
cap-fs-ext = "3.4"
directories = "6"
dunce = "1"
fastrand = "2"
fs4 = { version = "0.13", default-features = false, features = ["sync"] }
glob = "0.3"
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1"
